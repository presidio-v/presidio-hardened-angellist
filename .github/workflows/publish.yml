name: Publish to PyPI

# Publishes on a version tag push (e.g. v0.6.0) via PyPI Trusted Publishing
# (OIDC) — no long-lived API token is stored in the repository.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Generate SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          python -m pip install dist/*.whl
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

      - name: Stage provenance bundle as a release asset
        # Copy the Sigstore/in-toto attestation bundle to a named file so it can be
        # attached to the GitHub Release. OpenSSF Scorecard's Signed-Releases check
        # inspects release assets and recognises `.intoto.jsonl` provenance.
        run: cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl

      # Kept as its own artifact containing ONLY dist/, because the publish job
      # downloads it straight into dist/ and uploads everything it finds there.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: |
            sbom.cdx.json
            provenance.intoto.jsonl

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/presidio-hardened-angellist
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # Attach the SBOM and the in-toto provenance bundle to the GitHub Release for
  # this tag. OpenSSF Scorecard's Signed-Releases check reads release assets and
  # recognises `.intoto.jsonl` provenance; without a release carrying them, that
  # check cannot score regardless of how the artefacts were built.
  release-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub Release for this tag
    steps:
      - name: Download supply-chain artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain
          path: supply-chain/

      # Create the release if the tag has none yet, then upload (or replace) the
      # assets. --clobber keeps a re-run idempotent.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            supply-chain/sbom.cdx.json \
            supply-chain/provenance.intoto.jsonl
