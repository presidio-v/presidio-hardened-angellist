name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

# Least privilege: read-only at the top level (OpenSSF Scorecard Token-Permissions).
# The analyze job re-declares the write scope it needs to upload results.
permissions:
  contents: read

jobs:
  # NOTE: job id `analyze` + the language matrix produce the check name
  # "analyze (python)", which is a required status check on main. Do not add a
  # `name:` here or drop the matrix without updating branch protection first.
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write # upload CodeQL results to code scanning
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"

  # A second, fast, Python-specific SAST pass. CodeQL is the deep analysis;
  # Bandit catches the common Python security anti-patterns quickly and is the
  # tool named in ASSURANCE.md alongside it.
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit[toml]"

      - name: Run Bandit SAST scan
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            -f txt
